name: Fetch news and deploy

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: energy-hub
  cancel-in-progress: false   # runs queue instead of overlapping

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # always start from the latest main, not the triggering commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds and push (retry if another run pushed first)
        run: |
          git config user.name "energy-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            python scripts/fetch_feeds.py
            git add data/
            if git diff --cached --quiet; then
              echo "No changes"; break
            fi
            git commit -m "Update feed $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              break
            fi
            echo "Push rejected (attempt $attempt): resetting to latest main and re-fetching"
            git fetch origin main
            git reset --hard origin/main
            if [ "$attempt" = 3 ]; then echo "Giving up after 3 attempts"; exit 1; fi
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
